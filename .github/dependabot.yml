version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "Europe/Stockholm"
    allow:
      - dependency-name: "WWF-ITR"
    cooldown:
      default-days: 0
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
